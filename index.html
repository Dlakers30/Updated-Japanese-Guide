    {jp:"いっぷん、にふん、さんぷん、よんふん、ごふん",rom:"ippun, nifun, sanpun, yonfun, gofun",en:"1 min, 2 min, 3 min, 4 min, 5 min"}
  ]},
  {title:"Hours - jikan",color:"blue",grid:true,phrases:[
    {jp:"じかん",rom:"jikan",en:"Hour(s) - the counter for duration in hours"},
    {jp:"いちじかん",rom:"ichijikan",en:"1 hour"},
    {jp:"にじかん",rom:"nijikan",en:"2 hours"},
    {jp:"さんじかん",rom:"sanjikan",en:"3 hours"},
    {jp:"よじかん",rom:"yojikan",en:"4 hours"},
    {jp:"ごじかん",rom:"gojikan",en:"5 hours"},
    {jp:"はんじかん",rom:"hanjikan",en:"Half an hour (30 minutes)"},
    {jp:"いちじかんはん",rom:"ichijikan han",en:"1 hour and a half",note:"hour + han = hour and a half"},
    {jp:"なんじかんですか？",rom:"Nanjikan desuka?",en:"How many hours?",role:"you"},
    {jp:"にじかんくらいです。",rom:"Nijikan kurai desu.",en:"About 2 hours.",role:"staff"}
  ]},
  {title:"Important difference - じ vs じかん",color:"amber",phrases:[
    {jp:"じ (ji) = o'clock - a specific point in time",rom:"ji",en:"Ji = specific time on the clock  e.g. rokuji = 6 o'clock"},
    {jp:"じかん (jikan) = hours - a length of time",rom:"jikan",en:"Jikan = duration e.g. nijikan = 2 hours (duration)"},
    {jp:"ろくじ に おきます。",rom:"Rokuji ni okimasu.",en:"I wake up AT 6 o'clock. (ji = specific time)",note:"ni marks the specific time"},
    {jp:"まいにち ろくじかん ねます。",rom:"Mainichi rokujikan nemasu.",en:"I sleep for 6 hours every day. (jikan = duration)"},
    {jp:"にじかんはん かかります。",rom:"Nijikan han kakarimasu.",en:"It takes 2 and a half hours.",role:"staff"}
  ]},
  {title:"Around this time - koro and goro",color:"blue",phrases:[
    {jp:"ごろ / ころ",rom:"goro / koro",en:"Around / About - used for approximate times and periods",note:"goro after a time, koro in other contexts"},
    {jp:"くじごろ",rom:"kuji goro",en:"Around 9 o'clock",note:"time + goro = around that time"},
    {jp:"ごごさんじごろ",rom:"gogo sanji goro",en:"Around 3pm"},
    {jp:"くがつごろ",rom:"kugatsu goro",en:"Around September"},
    {jp:"きょうのごろ",rom:"kyou no koro",en:"Around this time of day"},
    {jp:"このころ",rom:"kono koro",en:"Around this time / these days"},
    {jp:"そのころ",rom:"sono koro",en:"Around that time (in the past)"},
    {jp:"なんじごろ がいいですか？",rom:"Nanji goro ga ii desuka?",en:"Around what time is good for you?",role:"staff"},
    {jp:"ごじごろ がいいです。",rom:"Goji goro ga ii desu.",en:"Around 5 o'clock is good.",role:"you"},
    {jp:"くじごろ に おきます。",rom:"Kuji goro ni okimasu.",en:"I wake up around 9.",role:"you"},
    {jp:"らいねんのはるごろ にほんに いきたいです。",rom:"Rainen no haru goro Nihon ni ikitai desu.",en:"I want to go to Japan around spring next year.",role:"you"}
  ]},
  {title:"Kurai vs Goro - both mean about but different usage",color:"amber",phrases:[
    {jp:"くらい / ぐらい (kurai / gurai)",rom:"kurai / gurai",en:"About / Approximately - used for amounts, quantities, distances, durations",note:"kurai/gurai goes after numbers and amounts"},
    {jp:"ごろ (goro)",rom:"goro",en:"Around - used specifically for approximate TIMES and TIME PERIODS",note:"goro goes after clock times, months, seasons"},
    {jp:"あるいて じゅっぷんくらいです。",rom:"Aruite juppun kurai desu.",en:"It is about 10 minutes walking. (kurai for duration amount)",role:"staff"},
    {jp:"ごじごろ に きてください。",rom:"Goji goro ni kite kudasai.",en:"Please come around 5 o'clock. (goro for clock time)",role:"staff"},
    {jp:"さんにんくらい います。",rom:"San-nin kurai imasu.",en:"There are about 3 people. (kurai for quantity)"},
    {jp:"くがつごろ にほんに いきます。",rom:"Kugatsu goro Nihon ni ikimasu.",en:"I will go to Japan around September. (goro for time period)"}
  ]},
  {title:"Situational dialogue - making plans with specific times",color:"",phrases:[
    {jp:"なんじに あいましょうか？",rom:"Nanji ni aimashou ka?",en:"What time shall we meet?",role:"staff"},
    {jp:"ごじごろ は どうですか？",rom:"Goji goro wa dou desuka?",en:"How about around 5 o'clock?",role:"you"},
    {jp:"いいですね。えきから どのくらいですか？",rom:"Ii desu ne. Eki kara donokurai desuka?",en:"Sounds good. How far is it from the station?",role:"staff"},
    {jp:"あるいて じゅっぷんくらいです。",rom:"Aruite juppun kurai desu.",en:"About 10 minutes on foot.",role:"you"},
    {jp:"しんかんせんで なんじかん かかりますか？",rom:"Shinkansen de nanjikan kakarimasuka?",en:"How many hours does it take by shinkansen?",role:"staff"},
    {jp:"にじかんはん くらいです。",rom:"Nijikan han kurai desu.",en:"About 2 and a half hours.",role:"you"},
    {jp:"わかりました！ごじごろに えきで あいましょう！",rom:"Wakarimashita! Goji goro ni eki de aimashou!",en:"Got it! Let us meet at the station around 5!",role:"staff"}
  ]},
  {title:"Useful time expressions",color:"amber",phrases:[
    {jp:"きょう",rom:"kyou",en:"Today"},
    {jp:"きのう",rom:"kinou",en:"Yesterday"},
    {jp:"あした",rom:"ashita",en:"Tomorrow"},
    {jp:"こんしゅう",rom:"konshu",en:"This week"},
    {jp:"せんしゅう",rom:"senshu",en:"Last week"},
    {jp:"らいしゅう",rom:"raishu",en:"Next week"},
    {jp:"こんげつ",rom:"kongetsu",en:"This month"},
    {jp:"せんげつ",rom:"sengetsu",en:"Last month"},
    {jp:"らいげつ",rom:"raigetsu",en:"Next month"},
    {jp:"ことし",rom:"kotoshi",en:"This year"},
    {jp:"きょねん",rom:"kyonen",en:"Last year"},
    {jp:"らいねん",rom:"rainen",en:"Next year"},
    {jp:"いま",rom:"ima",en:"Now"},
    {jp:"あとで",rom:"ato de",en:"Later"},
    {jp:"はやく",rom:"hayaku",en:"Early Quickly Soon"},
    {jp:"おそく",rom:"osoku",en:"Late Slowly"}
  ]}
]},

{id:"grammar",tab:"Grammar",title:"Grammar and Particles",sub:"Sentence structure, particles, verb forms, and patterns from all your lessons",sections:[
  {title:"Basic sentence order - Subject Object Verb",color:"blue",phrases:[
    {jp:"わたしは すしを たべます。",rom:"Watashi wa sushi wo tabemasu.",en:"I eat sushi. Japanese puts the verb LAST.",note:"Subject - Object - Verb. The biggest difference from English"},
    {jp:"わたしは みずを のみます。",rom:"Watashi wa mizu wo nomimasu.",en:"I drink water.",note:"watashi(I) wa(topic) mizu(water) wo(object) nomimasu(drink)"},
    {jp:"わたしは にほんに いきます。",rom:"Watashi wa Nihon ni ikimasu.",en:"I go to Japan.",note:"ni marks the destination"}
  ]},
  {title:"Particle wa - topic marker",color:"",layout:"grammar",phrases:[
    {jp:"は (wa)",rom:"wa",en:"Topic marker - as for / speaking of",note:"Written as ha but pronounced wa as a particle"},
    {jp:"わたし は ドノバンです。",rom:"Watashi wa Donoban desu.",en:"I am Donovan.",note:"wa marks watashi as the topic"},
    {jp:"ちょうしょく は どこですか？",rom:"Choshoku wa doko desuka?",en:"Where is breakfast?"},
    {jp:"レストラン は なんじからですか？",rom:"Resutoran wa nanji kara desuka?",en:"What time does the restaurant open?"}
  ]},
  {title:"Particle ga - subject marker",color:"",layout:"grammar",phrases:[
    {jp:"が (ga)",rom:"ga",en:"Subject marker - used for emphasis, likes, dislikes, ability"},
    {jp:"スポーツ が すきです。",rom:"Supootsu ga suki desu.",en:"I like sports.",note:"ga used with suki (like) and kirai (dislike)"},
    {jp:"おんがく が すきです。",rom:"Ongaku ga suki desu.",en:"I like music."},
    {jp:"にほんご が すこしわかります。",rom:"Nihongo ga sukoshi wakarimasu.",en:"I understand Japanese a little.",note:"ga used with wakaru (understand) and dekiru (can do)"}
  ]},
  {title:"Particle wo - object marker",color:"",layout:"grammar",phrases:[
    {jp:"を (wo)",rom:"wo",en:"Object marker - marks what the verb is acting on",note:"Written wo, pronounced o"},
    {jp:"ラーメン を たべます。",rom:"Ramen wo tabemasu.",en:"I eat ramen.",note:"wo marks ramen as what is being eaten"},
    {jp:"みず を のみます。",rom:"Mizu wo nomimasu.",en:"I drink water."},
    {jp:"きっぷ を かいたいです。",rom:"Kippu wo kaitai desu.",en:"I want to buy a ticket.",note:"wo from your transport lesson!"},
    {jp:"にもつ を あずけたいです。",rom:"Nimotsu wo azuketai desu.",en:"I want to leave my luggage.",note:"wo from your hotel lesson!"}
  ]},
  {title:"Particle ni - direction location time",color:"",layout:"grammar",phrases:[
    {jp:"に (ni)",rom:"ni",en:"Direction, destination, location, time, or indirect object marker"},
    {jp:"にほん に いきます。",rom:"Nihon ni ikimasu.",en:"I go TO Japan.",note:"ni = to toward direction"},
    {jp:"ろくじ に たべます。",rom:"Rokuji ni tabemasu.",en:"I eat AT 6 oclock.",note:"ni = at specific time"},
    {jp:"レストラン に あります。",rom:"Resutoran ni arimasu.",en:"It is AT the restaurant.",note:"ni = location of existence"},
    {jp:"みぎ に まがってください。",rom:"Migi ni magatte kudasai.",en:"Please turn TO the right.",note:"ni = direction of movement"}
  ]},
  {title:"Particle de - location of action or means",color:"",layout:"grammar",phrases:[
    {jp:"で (de)",rom:"de",en:"Where an action happens, or the means used",note:"Different from ni - de is WHERE you DO something"},
    {jp:"レストラン で たべます。",rom:"Resutoran de tabemasu.",en:"I eat AT the restaurant.",note:"de = place where action happens"},
    {jp:"カード で いいですか？",rom:"Kado de ii desuka?",en:"Can I pay BY card?",note:"de = means instrument"},
    {jp:"バス で いきます。",rom:"Basu de ikimasu.",en:"I go BY bus.",note:"de = means of transport"},
    {jp:"にほんご で はなします。",rom:"Nihongo de hanashimasu.",en:"I speak IN Japanese.",note:"de = language used"}
  ]},
  {title:"Particle no - possession and connection",color:"",layout:"grammar",phrases:[
    {jp:"の (no)",rom:"no",en:"Connects two nouns - possession, belonging, description",note:"Like apostrophe-s in English: A no B = A's B"},
    {jp:"わたし の なまえ は ドノバンです。",rom:"Watashi no namae wa Donoban desu.",en:"My name is Donovan.",note:"watashi no = my"},
    {jp:"ひとつめ の こうさてん",rom:"Hitotsu me no kousaten",en:"The FIRST intersection",note:"no from your directions lesson!"},
    {jp:"つぎ の バス は なんじですか？",rom:"Tsugi no basu wa nanji desuka?",en:"What time is the NEXT bus?",note:"tsugi no = next"}
  ]},
  {title:"Particles kara and made - from and until",color:"",phrases:[
    {jp:"から (kara)",rom:"kara",en:"From Starting from Since Because"},
    {jp:"まで (made)",rom:"made",en:"Until Up to As far as"},
    {jp:"ろくじ から です。",rom:"Rokuji kara desu.",en:"It starts from 6:00.",note:"kara from your hotel lesson!"},
    {jp:"じゅうじ まで です。",rom:"Juuji made desu.",en:"Until 10:00.",note:"made from your hotel lesson!"},
    {jp:"ケンタッキー から きました。",rom:"Kentakkii kara kimashita.",en:"I came FROM Kentucky.",note:"kara = from place of origin"}
  ]},
  {title:"Particle mo - also and too",color:"",layout:"grammar",phrases:[
    {jp:"も (mo)",rom:"mo",en:"Also Too - replaces wa or ga to add inclusion",note:"Swap wa or ga with mo to say me too or also"},
    {jp:"わたし も げんきです。",rom:"Watashi mo genki desu.",en:"I am well TOO.",note:"mo replaces wa from your greetings lesson!"},
    {jp:"おんがく も すきです。",rom:"Ongaku mo suki desu.",en:"I also like music.",role:"you"},
    {jp:"これ も ください。",rom:"Kore mo kudasai.",en:"Please give me this one TOO.",role:"you"}
  ]},
  {title:"Verb endings - masu form polite",color:"purple",layout:"grammar",phrases:[
    {jp:"～ます",rom:"~masu",en:"Polite present future tense - use this in daily life"},
    {jp:"たべます",rom:"tabemasu",en:"eat will eat"},
    {jp:"のみます",rom:"nomimasu",en:"drink will drink"},
    {jp:"いきます",rom:"ikimasu",en:"go will go"},
    {jp:"かいます",rom:"kaimasu",en:"buy will buy"},
    {jp:"わかります",rom:"wakarimasu",en:"understand"},
    {jp:"あります",rom:"arimasu",en:"there is have for things"},
    {jp:"います",rom:"imasu",en:"there is am for people and animals"}
  ]},
  {title:"Negative form - masen",color:"purple",layout:"grammar",phrases:[
    {jp:"～ません",rom:"~masen",en:"Polite negative - do not. Change masu to masen"},
    {jp:"わかりません。",rom:"Wakarimasen.",en:"I do not understand.",note:"Very useful! Say this when lost in conversation"},
    {jp:"にほんごが わかりません。",rom:"Nihongo ga wakarimasen.",en:"I do not understand Japanese.",role:"you"},
    {jp:"えいごが わかりますか？",rom:"Eigo ga wakarimasu ka?",en:"Do you understand English?",role:"you"}
  ]},
  {title:"Past tense - mashita",color:"purple",layout:"grammar",phrases:[
    {jp:"～ました",rom:"~mashita",en:"Polite past tense - did. Change masu to mashita"},
    {jp:"たべました。",rom:"Tabemashita.",en:"I ate."},
    {jp:"いきました。",rom:"Ikimashita.",en:"I went."},
    {jp:"ケンタッキーから きました。",rom:"Kentakkii kara kimashita.",en:"I came from Kentucky.",note:"kimashita from your intro lesson!"},
    {jp:"みちに まよいました。",rom:"Michi ni mayoimashita.",en:"I got lost.",note:"mayoimashita from your directions lesson!"}
  ]},
  {title:"Want to - tai form",color:"purple",phrases:[
    {jp:"～たいです",rom:"~tai desu",en:"I want to ___. Drop masu and add tai",note:"From your transportation lesson!"},
    {jp:"かいます→かいたいです",rom:"kaimasu - kaitai desu",en:"buy - want to buy"},
    {jp:"たべます→たべたいです",rom:"tabemasu - tabetai desu",en:"eat - want to eat"},
    {jp:"のみます→のみたいです",rom:"nomimasu - nomitai desu",en:"drink - want to drink"},
    {jp:"いきます→いきたいです",rom:"ikimasu - ikitai desu",en:"go - want to go"}
  ]},
  {title:"Te-form groups - overview",color:"purple",layout:"grammar",phrases:[
    {jp:"て形 (te-kei)",rom:"te-kei",en:"The te-form connects verbs to almost everything - requests, permission, sequences.",note:"Every verb belongs to one of 3 groups, and each group conjugates differently. Learn the group, learn the pattern."},
    {jp:"1グループ - い・ち・り・び・み・に・き・ぎ・し",rom:"Group 1 - u-verbs",en:"Group 1 (u-verbs): the sound the verb ends in decides the te-form ending.",note:"Mnemonic: Group 1 is the 'sound sorter' - listen to the last sound before masu and pick the matching rule below."},
    {jp:"2グループ - e-ます",rom:"Group 2 - ru-verbs",en:"Group 2 (ru-verbs): just drop masu and add te. No sound rules needed.",note:"Mnemonic: Group 2 is the 'lazy group' - always the same simple swap."},
    {jp:"3グループ - します・きます",rom:"Group 3 - irregular",en:"Group 3 (irregular): only two verbs in the whole language - suru and kuru.",note:"Mnemonic: Only 2 verbs total - just memorize します→して and きます→きて cold."}
  ]},
  {title:"Group 1: い・ち・り → って",color:"purple",phrases:[
    {jp:"かいます→かって",rom:"kaimasu - katte",en:"buy - buying / having bought",note:"Mnemonic: い・ち・り all 'trip' and land as って - three different sounds, one identical landing."},
    {jp:"もちます→もって",rom:"mochimasu - motte",en:"hold / carry - holding"},
    {jp:"かえります→かえって",rom:"kaerimasu - kaette",en:"return / go home - returning"}
  ]},
  {title:"Group 1: び・み・に → んで",color:"purple",phrases:[
    {jp:"よびます→よんで",rom:"yobimasu - yonde",en:"call out - calling",note:"Mnemonic: び・み・に are all 'nose sounds' (b/m/n use your nose or lips) - they nasalize into ん, then add で."},
    {jp:"のみます→のんで",rom:"nomimasu - nonde",en:"drink - drinking"}
  ]},
  {title:"Group 1: き → いて",color:"purple",phrases:[
    {jp:"かきます→かいて",rom:"kakimasu - kaite",en:"write - writing",note:"Mnemonic: き softens into いて - the hard 'k' click smooths out."}
  ]},
  {title:"Group 1: ぎ → いで",color:"purple",phrases:[
    {jp:"いそぎます→いそいで",rom:"isogimasu - isoide",en:"hurry - hurrying",note:"Mnemonic: ぎ is just き with a voiced dakuten (＂) - so its te-form is いで instead of いて, same pattern, voiced version."}
  ]},
  {title:"Group 1: し → して",color:"purple",phrases:[
    {jp:"はなします→はなして",rom:"hanashimasu - hanashite",en:"speak / talk - speaking",note:"Mnemonic: the easiest rule - し just becomes して, no twisting needed."}
  ]},
  {title:"Group 1: the one exception",color:"purple",phrases:[
    {jp:"いきます→いって",rom:"ikimasu - itte",en:"go - going",note:"Mnemonic: 行く (iku) SHOULD follow the き→いて rule but breaks it and copies the い・ち・り→って pattern instead. It's the one verb every learner mixes up - drill it separately."}
  ]},
  {title:"Group 2 (る-verbs, e-masu): drop masu, add te",color:"purple",phrases:[
    {jp:"ねます→ねて",rom:"nemasu - nete",en:"sleep - sleeping",note:"Mnemonic: no sound rules for Group 2 - just chop masu and glue on te. Every time."},
    {jp:"たべます→たべて",rom:"tabemasu - tabete",en:"eat - eating"},
    {jp:"みます→みて",rom:"mimasu - mite",en:"see / look - seeing"},
    {jp:"おきます、かります、います など",rom:"okimasu, karimasu, imasu, etc.",en:"wake up, borrow, exist/be - these END in i+masu but are secretly Group 2!",note:"Mnemonic: these LOOK like Group 1 (i-sound before masu) but conjugate like Group 2 instead - おきて, かりて, いて. There's no shortcut, just memorize this short list of imposters."}
  ]},
  {title:"Group 3 (irregular): only 2 verbs to memorize",color:"purple",phrases:[
    {jp:"します→して",rom:"shimasu - shite",en:"do - doing",note:"Mnemonic: する is used in tons of compound verbs (べんきょうする, かいものする) - nail this one and you unlock dozens of others."},
    {jp:"きます→きて",rom:"kimasu - kite",en:"come - coming",note:"Mnemonic: 来ます(kuru, to come) is irregular - don't confuse it with 聞きます(kikimasu, to listen) which is a normal Group 1 き→いて verb!"}
  ]},
  {title:"Te-form - please do",color:"purple",phrases:[
    {jp:"～てください",rom:"~te kudasai",en:"Please ___. Polite request using te-form",note:"From your directions lesson!"},
    {jp:"いきます→いって→まっすぐ いってください。",rom:"ikimasu - itte - massugu itte kudasai",en:"go - going - Please go straight."},
    {jp:"まがります→まがって→みぎに まがってください。",rom:"magarimasu - magatte - migi ni magatte kudasai",en:"turn - turning - Please turn right."},
    {jp:"みせます→みせて→パスポートを みせてください。",rom:"misemasu - misete - pasupoto wo misete kudasai",en:"show - showing - Please show me your passport."}
  ]},
  {title:"A wa B desu pattern - A is B",color:"",layout:"grammar",phrases:[
    {jp:"A は B です。",rom:"A wa B desu.",en:"A is B. The most fundamental Japanese sentence",note:"desu = am is are polite"},
    {jp:"わたしは ドノバンです。",rom:"Watashi wa Donoban desu.",en:"I am Donovan."},
    {jp:"これは なんですか？",rom:"Kore wa nan desuka?",en:"What is this?",note:"kore = this nan = what"},
    {jp:"ふたりです。",rom:"Futari desu.",en:"Two people.",note:"Short form - drop watashitachi wa in casual speech"}
  ]},
  {title:"Question words",color:"blue",phrases:[
    {jp:"なに / なん",rom:"nani / nan",en:"What?",note:"nan before desu de no, nani before wo ga"},
    {jp:"どこ",rom:"doko",en:"Where?"},
    {jp:"だれ",rom:"dare",en:"Who?"},
    {jp:"いつ",rom:"itsu",en:"When?"},
    {jp:"なんじ",rom:"nanji",en:"What time?"},
    {jp:"いくら",rom:"ikura",en:"How much?"},
    {jp:"なんにん",rom:"nannin",en:"How many people?"},
    {jp:"どのくらい",rom:"donokurai",en:"How long? How much? amount or duration"},
    {jp:"どう",rom:"dou",en:"How? In what way?"},
    {jp:"なぜ / どうして",rom:"naze / doushite",en:"Why?"}
  ]},
  {title:"Possession - no and mine yours theirs",color:"blue",phrases:[
    {jp:"わたしの",rom:"watashi no",en:"My / Mine"},
    {jp:"あなたの",rom:"anata no",en:"Your / Yours"},
    {jp:"かれの",rom:"kare no",en:"His"},
    {jp:"かのじょの",rom:"kanojo no",en:"Her / Hers"},
    {jp:"わたしたちの",rom:"watashitachi no",en:"Our / Ours"},
    {jp:"かれらの",rom:"karera no",en:"Their / Theirs"},
    {jp:"わたしの かばんです。",rom:"Watashi no kaban desu.",en:"It is my bag.",note:"watashi no + noun = my noun"},
    {jp:"あなたの なまえは なんですか？",rom:"Anata no namae wa nan desuka?",en:"What is your name?",role:"you"},
    {jp:"これは だれの ですか？",rom:"Kore wa dare no desuka?",en:"Whose is this?",role:"you"},
    {jp:"わたしのです。",rom:"Watashi no desu.",en:"It is mine.",note:"Drop the noun after no - very natural in conversation",role:"you"},
    {jp:"あなたのですか？",rom:"Anata no desuka?",en:"Is it yours?",role:"you"}
  ]},
  {title:"KO-SO-A-DO: demonstratives at a glance",color:"blue",layout:"kosoado",kosoado:{
    columns:[
      {key:"ko",label:"KO",kana:"こ"},
      {key:"so",label:"SO",kana:"そ"},
      {key:"a",label:"A",kana:"あ"},
      {key:"do",label:"DO",kana:"ど"}
    ],
    rows:[

        ko:{jp:"これ",rom:"kore",en:"this"},
        so:{jp:"それ",rom:"sore",en:"that"},
        a:{jp:"あれ",rom:"are",en:"that over there"},
        do:{jp:"どれ",rom:"dore",en:"which"}
      }},
      {label:"+ Noun",sub:"〜の (modifying)",cells:{
        ko:{jp:"この",rom:"kono",en:"this + noun"},
        so:{jp:"その",rom:"sono",en:"that + noun"},

      {label:"Place",sub:"場所 (basho)",cells:{

      }}

// ── Voice setup ──────────────────────────────────────────────────
let jpVoice=null,enVoice=null,currentSpeed=0.85,isPlayingAll=false;
function loadVoices(){
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length)return;
  const jpSel=document.getElementById("jpVoice");
  const enSel=document.getElementById("enVoice");
  jpSel.innerHTML="";enSel.innerHTML="";
  const jpV=voices.filter(v=>v.lang.startsWith("ja"));
  const enV=voices.filter(v=>v.lang.startsWith("en"));
  jpV.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;jpSel.appendChild(o);});
  enV.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;enSel.appendChild(o);});
  jpVoice=jpV[0]||null;
  enVoice=enV[0]||null;
  jpSel.onchange=()=>{jpVoice=jpV[jpSel.value];};
  document.getElementById("voiceStatus").textContent=jpVoice?"Japanese voice ready":"No Japanese voice - install Japanese in device settings";
}
window.speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function cleanForSpeech(text){
  return text.replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g,"").replace(/[○✕×◎]/g,"").replace(/【|】/g,"").replace(/^[\s・\-]+/,"").trim();
}

function speak(text,onEnd){
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(cleanForSpeech(text));
  utt.voice=jpVoice;utt.lang="ja-JP";utt.rate=currentSpeed;utt.pitch=1.0;
  utt.onend=onEnd||null;
  window.speechSynthesis.speak(utt);
}

function speakPhrase(jp,en,btnEl){
  stopAll();
  document.getElementById("npJp").textContent=jp;
  document.getElementById("npEn").textContent=en;
  document.getElementById("nowPlaying").classList.add("visible");
  if(btnEl){btnEl.textContent="||";btnEl.classList.add("playing");}
  speak(jp,()=>{
    if(btnEl){btnEl.textContent=">>";btnEl.classList.remove("playing");}
    document.getElementById("nowPlaying").classList.remove("visible");
  });
}

function stopAll(){
  window.speechSynthesis.cancel();isPlayingAll=false;
  document.getElementById("nowPlaying").classList.remove("visible");
  document.querySelectorAll(".play-btn").forEach(b=>{b.textContent=">>";b.classList.remove("playing");});
  document.querySelectorAll(".play-all-btn").forEach(b=>{b.textContent="Play All";b.classList.remove("stop");b.onclick=()=>playAll(b.dataset.unit);});
  const p=document.getElementById("progressText");if(p)p.textContent="";
}

function playAll(unitId){
  stopAll();
  const unit=units.find(u=>u.id===unitId);if(!unit)return;
  const allPhrases=unit.sections.flatMap(s=>(s.phrases||[]));
  isPlayingAll=true;
  const btn=document.getElementById("play-all-"+unitId);
  if(btn){btn.textContent="Stop";btn.classList.add("stop");btn.onclick=stopAll;}
  let i=0;
  function playNext(){
    if(!isPlayingAll||i>=allPhrases.length){stopAll();return;}
    const p=allPhrases[i];
    if(!p.jp){i++;setTimeout(playNext,200);return;}
    const prog=document.getElementById("progressText");
    if(prog)prog.textContent=(i+1)+" / "+allPhrases.length;
    document.getElementById("npJp").textContent=p.jp;
    document.getElementById("npEn").textContent=p.en;
    document.getElementById("nowPlaying").classList.add("visible");
    speak(p.jp,()=>{if(!isPlayingAll)return;i++;setTimeout(playNext,900);});
  }
  playNext();
}

function setSpeed(rate){
  currentSpeed=rate;
  document.querySelectorAll(".speed-btn").forEach(b=>{
    b.classList.toggle("active",
      (rate===0.65&&b.textContent==="Slow")||
      (rate===0.85&&b.textContent==="Normal")||
      (rate===1.0&&b.textContent==="Fast"));
  });
}

function renderTabs(){
  const el=document.getElementById("tabs");
  units.forEach((u,i)=>{
    const t=document.createElement("div");
    t.className="tab"+(i===0?" active":"");
    t.textContent=u.tab;t.onclick=()=>switchTab(u.id);
    el.appendChild(t);
  });
}

function switchTab(unitId){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",units[i].id===unitId));
  document.querySelectorAll(".unit").forEach(u=>u.classList.toggle("active",u.id==="unit-"+unitId));
  stopAll();
}

function esc(s){
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}

// ── Star / favorite system (persisted in localStorage) ──────────
function loadStars(){
  try{
    const raw=localStorage.getItem("jpGuideStars");
    return raw?JSON.parse(raw):[];
  }catch(e){return [];}
}
function saveStars(arr){
  try{localStorage.setItem("jpGuideStars",JSON.stringify(arr));}catch(e){}
}
function isStarred(unitId,jp){
  return loadStars().some(s=>s.unitId===unitId && s.jp===jp);
}
function starBtnHtml(unitId,jp,en,rom,extraClass){
  if(!unitId)return "";
  const starred=isStarred(unitId,jp);
  const cls=(extraClass||"star-btn")+(starred?" starred":"");
  return `<button class="${cls}" onclick="event.stopPropagation();toggleStar(this,'${unitId}','${esc(jp)}','${esc(en||"")}','${esc(rom||"")}')">${starred?"&#9733;":"&#9734;"}</button>`;
}
function toggleStar(btn,unitId,jp,en,rom){
  let stars=loadStars();
  const idx=stars.findIndex(s=>s.unitId===unitId && s.jp===jp);
  if(idx>=0){
    stars.splice(idx,1);
    btn.classList.remove("starred");
    btn.innerHTML="&#9734;";
  } else {
    stars.push({unitId,jp,en,rom});
    btn.classList.add("starred");
    btn.innerHTML="&#9733;";
  }
  saveStars(stars);
  refreshStarReviewWrap(unitId);
}
function refreshStarReviewWrap(unitId){
  const el=document.getElementById("star-review-wrap-"+unitId);
  if(el)el.innerHTML=buildStarReviewInner(unitId);
}
function buildStarReviewInner(unitId){
  const items=loadStars().filter(s=>s.unitId===unitId);
  if(!items.length)return "";
  return `<div class="star-review-card">
    <div class="star-review-header">
      <span class="star-review-title">&#9733; Starred in this section</span>
      <span class="star-review-count">${items.length} item${items.length===1?"":"s"}</span>
    </div>
    <div class="star-review-chips">${items.map(it=>`<span class="star-chip">${it.jp}</span>`).join("")}</div>
    <button class="star-review-btn" onclick="startStarReview('${unitId}')">Review as Flashcards</button>
    <div id="star-review-session-${unitId}"></div>
  </div>`;
}

const starReviewSessions={};
function startStarReview(unitId){
  const items=shuffleArr(loadStars().filter(s=>s.unitId===unitId));
  starReviewSessions[unitId]={items,index:0,known:0,review:0,flipped:false};
  renderStarReviewSession(unitId);
}
function renderStarReviewSession(unitId){
  const s=starReviewSessions[unitId];
  const wrap=document.getElementById("star-review-session-"+unitId);
  if(!wrap)return;
  if(!s || s.index>=s.items.length){
    if(s && s.items.length){
      wrap.innerHTML=`<div class="star-session-done">Reviewed ${s.items.length} item${s.items.length===1?"":"s"} &middot; ${s.known} known, ${s.review} still learning.
        <button class="star-review-btn" onclick="${unitId==="saved"?"startSavedReview()":"startStarReview('"+unitId+"')"}">Review Again</button></div>`;
    } else {
      wrap.innerHTML="";
    }
    return;
  }
  const item=s.items[s.index];
  let html=`<div class="star-flip-card${s.flipped?" flipped":""}" onclick="flipStarCard('${unitId}')">
    <div class="star-flip-progress">${s.index+1} / ${s.items.length}</div>
    <div class="star-flip-front">${item.en}</div>`;
  if(s.flipped){
    html+=`<div class="star-flip-back">
      <div class="star-flip-jp">${item.jp}</div>
      <div class="star-flip-rom">${item.rom||""}</div>
      <button class="star-flip-play" onclick="event.stopPropagation();speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button>
    </div>`;
  } else {
    html+=`<div class="star-flip-hint">Tap to reveal</div>`;
  }
  html+=`</div>`;
  if(s.flipped){
    html+=`<div class="star-flip-actions">
      <button class="star-flip-btn learning" onclick="answerStarCard('${unitId}',false)">Still Learning</button>
      <button class="star-flip-btn known" onclick="answerStarCard('${unitId}',true)">Got It</button>
    </div>`;
  }
  wrap.innerHTML=html;
}
function flipStarCard(unitId){
  const s=starReviewSessions[unitId];
  if(!s)return;
  s.flipped=true;
  renderStarReviewSession(unitId);
}
function answerStarCard(unitId,known){
  const s=starReviewSessions[unitId];
  if(!s)return;
  if(known)s.known++; else s.review++;
  s.index++;
  s.flipped=false;
  renderStarReviewSession(unitId);
}

// ── Phrase-type detection & renderers (table / chat / conjugation) ──
function phraseType(p){
  if(p.jp && p.jp.indexOf("→")!==-1) return "conj";
  if(p.role) return "chat";
  return "vocab";
}

function renderPhraseRuns(phrases,unitId){
  let html="";
  let i=0;
  while(i<phrases.length){
    const type=phraseType(phrases[i]);
    const run=[];
    while(i<phrases.length && phraseType(phrases[i])===type){run.push(phrases[i]);i++;}
    if(type==="vocab") html+=renderVocabTable(run,unitId);
    else if(type==="chat"){
      const roles=new Set(run.map(p=>p.role));
      if(roles.size>1){
        html+=renderChatThread(run,unitId);
      } else {
        html+=renderVocabTable(run,unitId);
      }
    }
    else html+=renderConjGrid(run,unitId);
  }
  return html;
}

function renderVocabTable(phrases,unitId){
  let html='<div class="vocab-table">';
  phrases.forEach(p=>{
    html+=`<div class="vocab-row" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(p.jp)}','${esc(p.en)}',this.querySelector('.vocab-play'))">
      <div class="vocab-main">
        <div class="vocab-jp">${p.jp}</div>
        <div class="vocab-sub"><span class="vocab-rom">${p.rom||""}</span><span class="vocab-en">${p.en||""}</span></div>
        ${p.note?`<div class="vocab-note">* ${p.note}</div>`:""}
      </div>
      <div class="vocab-actions">
        ${starBtnHtml(unitId,p.jp,p.en,p.rom)}
        <button class="vocab-play" onclick="event.stopPropagation();speakPhrase('${esc(p.jp)}','${esc(p.en)}',this)">&gt;&gt;</button>
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderConjGrid(phrases,unitId){
  let html='<div class="conj-grid">';
  phrases.forEach(p=>{
    const jpParts=p.jp.split("→").map(s=>s.trim());
    const romParts=(p.rom||"").split(" - ").map(s=>s.trim()).filter(Boolean);
    const speakText=jpParts.join(" ");
    let chipsHtml="";
    jpParts.forEach((part,idx)=>{
      const isLast=idx===jpParts.length-1;
      chipsHtml+=`<span class="conj-chip ${isLast?"target":"base"}">${part}</span>`;
      if(!isLast)chipsHtml+=`<span class="conj-arrow">&#8594;</span>`;
    });
    const romLine=romParts.join(" &rarr; ");
    html+=`<div class="conj-card" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(speakText)}','${esc(p.en)}',this.querySelector('.conj-play'))">

        <button class="conj-play" onclick="event.stopPropagation();speakPhrase('${esc(speakText)}','${esc(p.en)}',this)">&gt;&gt;</button>

      <div class="conj-en">${p.en||""}</div>
      ${p.note?`<div class="conj-note">* ${p.note}</div>`:""}

  });
  html+='</div>';

}

function collectQuizItemsFromUnit(u){
  const out=[];
  (u.sections||[]).forEach(sec=>{
    (sec.phrases||[]).forEach(p=>{
      if(p.jp && p.en && p.jp.indexOf("→")===-1){
        out.push({jp:p.jp,en:p.en,rom:p.rom||""});
      }
    });
  });
  return out;
}

function dedupeQuizItems(items){
  const seen=new Set();
  const out=[];
  items.forEach(it=>{
    const key=it.jp+"|"+it.en;
    if(!seen.has(key)){seen.add(key);out.push(it);}
  });
  return out;
}

function buildQuizPool(topicId){
  let items=[];
  if(topicId==="saved"){
    items=loadSaved().map(s=>({jp:s.jp,en:s.en,rom:s.rom||""}));
  } else if(topicId==="kana"){
    items=KANA_QUIZ_ITEMS.map(k=>({jp:k.c,en:k.r,rom:k.r}));
  } else if(topicId==="all"){
    units.forEach(u=>{
      if(u.id==="quiz"||u.id==="translate")return;
      if(u.id==="saved"){items=items.concat(loadSaved().map(s=>({jp:s.jp,en:s.en,rom:s.rom||""})));return;}
      if(u.id==="kana"){items=items.concat(KANA_QUIZ_ITEMS.map(k=>({jp:k.c,en:k.r,rom:k.r})));}
      else{items=items.concat(collectQuizItemsFromUnit(u));}
    });
  } else {
    const u=units.find(x=>x.id===topicId);
    if(u)items=collectQuizItemsFromUnit(u);
  }
  return dedupeQuizItems(items);
}

function shuffleArr(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

function startQuiz(){
  stopAll();
  const topicSel=document.getElementById("quizTopic");
  const topicId=topicSel.value;
  const topicLabel=topicSel.options[topicSel.selectedIndex].textContent;
  const direction=document.querySelector(".quiz-toggle-btn.active").dataset.dir;
  const countVal=document.querySelector(".quiz-count-btn.active").dataset.count;
  const pool=buildQuizPool(topicId);
  if(pool.length<2){
    alert("Not enough items in this topic for a quiz. Try a bigger topic like All Topics.");
    return;
  }
  const shuffledPool=shuffleArr(pool);
  const total=countVal==="all"?Math.min(shuffledPool.length,40):Math.min(parseInt(countVal,10),shuffledPool.length);
  quizState={
    topicId,topicLabel,direction,
    pool:shuffledPool,
    questions:shuffledPool.slice(0,total),
    index:0,score:0,answered:false
  };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const div=document.getElementById("unit-quiz");
  const qs=quizState;
  const item=qs.questions[qs.index];
  const isEnToJp=qs.direction==="en-jp";
  const promptText=isEnToJp?item.en:item.jp;
  const correctText=isEnToJp?item.jp:item.en;

  const others=qs.pool.filter(p=>p!==item);
  const shuffledOthers=shuffleArr(others);
  const seenTexts=new Set([correctText.trim().toLowerCase()]);
  const distractors=[];
  for(let k=0;k<shuffledOthers.length && distractors.length<3;k++){
    const t=(isEnToJp?shuffledOthers[k].jp:shuffledOthers[k].en).trim();
    const key=t.toLowerCase();
    if(!seenTexts.has(key)){seenTexts.add(key);distractors.push(t);}
  }
  const options=shuffleArr([correctText].concat(distractors));
  const correctIndex=options.indexOf(correctText);

  qs.currentOptions=options;
  qs.currentCorrectIndex=correctIndex;
  qs.currentItem=item;
  qs.answered=false;

  const optClass=isEnToJp?"quiz-option-jp":"";
  let html=`<div class="quiz-progress">Question ${qs.index+1} of ${qs.questions.length} &middot; ${qs.topicLabel} &middot; Score ${qs.score}</div>
  <div class="quiz-prompt-card">
    <div class="quiz-prompt-label">${isEnToJp?"English &rarr; Japanese":"Japanese &rarr; English"}</div>
    <div class="quiz-prompt-main${isEnToJp?"":" quiz-jp"}">${promptText}</div>
  </div>
  <div class="quiz-options" id="quizOptions">`;
  options.forEach((opt,i)=>{
    html+=`<button class="quiz-option-btn ${optClass}" onclick="selectQuizAnswer(${i})">${opt}</button>`;
  });
  html+=`</div><div class="quiz-feedback" id="quizFeedback"></div><div id="quizNextWrap"></div>`;
  div.innerHTML=html;
}

function selectQuizAnswer(i){
  const qs=quizState;
  if(qs.answered)return;
  qs.answered=true;
  const correct=i===qs.currentCorrectIndex;
  if(correct)qs.score++;
  const buttons=document.querySelectorAll("#quizOptions .quiz-option-btn");
  buttons.forEach((b,idx)=>{
    b.classList.add("disabled");
    if(idx===qs.currentCorrectIndex)b.classList.add("correct");
    else if(idx===i)b.classList.add("wrong");
  });
  const item=qs.currentItem;
  const fb=document.getElementById("quizFeedback");
  fb.innerHTML=correct
    ?`<div class="quiz-fb-good">Correct!<button class="quiz-fb-play" onclick="speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button></div>${item.rom?`<div class="quiz-fb-rom">${item.rom}</div>`:""}`
    :`<div class="quiz-fb-bad">Not quite &mdash; correct answer:<button class="quiz-fb-play" onclick="speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button></div><div class="quiz-fb-rom">${item.jp}${item.rom?" &middot; "+item.rom:""} &mdash; ${item.en}</div>`;
  const isLast=qs.index>=qs.questions.length-1;
  document.getElementById("quizNextWrap").innerHTML=
    `<button class="quiz-next-btn" onclick="${isLast?"showQuizResults()":"nextQuizQuestion()"}">${isLast?"See Results":"Next Question"}</button>`;
}

function nextQuizQuestion(){
  quizState.index++;
  renderQuizQuestion();
}

function showQuizResults(){
  const qs=quizState;
  const pct=Math.round((qs.score/qs.questions.length)*100);
  const msg=pct>=90?"Excellent! You've got this down.":pct>=70?"Great job!":pct>=50?"Good effort, keep practicing!":"Keep at it - repetition is how it sticks.";
  const div=document.getElementById("unit-quiz");
  div.innerHTML=`<div class="quiz-result-card">
    <div class="quiz-result-score">${qs.score} / ${qs.questions.length}</div>
    <div class="quiz-result-pct">${pct}% &middot; ${qs.topicLabel}</div>
    <div class="quiz-result-msg">${msg}</div>
    <div class="quiz-result-buttons">
      <button class="quiz-start-btn" onclick="retryQuiz()">Try Again</button>
      <button class="quiz-secondary-btn" onclick="renderQuizTab()">New Quiz</button>
    </div>
  </div>`;
}

function retryQuiz(){
  const qs=quizState;
  const freshPool=shuffleArr(qs.pool);
  quizState={
    topicId:qs.topicId,topicLabel:qs.topicLabel,direction:qs.direction,
    pool:freshPool,
    questions:freshPool.slice(0,qs.questions.length),
    index:0,score:0,answered:false
  };
  renderQuizQuestion();
}

let searchIndex=[];
let currentSearchResults=[];

function buildSearchIndex(){
  const idx=[];
  units.forEach(unit=>{
    if(unit.id==="quiz")return;
    (unit.sections||[]).forEach(sec=>{
      if(sec.layout==="kosoado" && sec.kosoado){
        sec.kosoado.rows.forEach(row=>{
          sec.kosoado.columns.forEach(col=>{
            const cell=row.cells[col.key];
            if(cell){
              idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:cell.jp,rom:cell.rom||"",en:cell.en||"",note:""});
            }
          });
        });
      }
      (sec.phrases||[]).forEach(p=>{
        if(!p.jp)return;
        idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:p.jp,rom:p.rom||"",en:p.en||"",note:p.note||""});
      });
    });
  });
  if(typeof KANA_QUIZ_ITEMS!=="undefined"){
    KANA_QUIZ_ITEMS.forEach(k=>{
      idx.push({unitId:"kana",unitTab:"Hiragana and Katakana",sectionTitle:"Kana chart",jp:k.c,rom:k.r,en:k.r,note:""});
    });
  }
  loadSaved().forEach(s=>{
    idx.push({unitId:"saved",unitTab:"Saved Phrases",sectionTitle:"Saved",jp:s.jp,rom:s.rom||"",en:s.en||"",note:s.note||""});
  });
  searchIndex=idx;
}

function performSearch(q){
  const ql=q.toLowerCase();
  return searchIndex.filter(item=>
    item.jp.indexOf(q)!==-1 ||
    (item.rom && item.rom.toLowerCase().indexOf(ql)!==-1) ||
    (item.en && item.en.toLowerCase().indexOf(ql)!==-1) ||
    (item.note && item.note.toLowerCase().indexOf(ql)!==-1)
  );
}

function handleSearchInput(){
  const input=document.getElementById("searchInput");
  const clearBtn=document.getElementById("searchClearBtn");
  const q=input.value.trim();
  clearBtn.style.display=q?"flex":"none";
  if(!q){hideSearchResults();return;}
  renderSearchResults(performSearch(q),q);
}

function renderSearchResults(results,q){
  const wrap=document.getElementById("searchResults");
  if(!results.length){
    wrap.innerHTML=`<div class="search-empty">No matches for "${esc(q)}"</div>`;
    wrap.classList.add("show");
    currentSearchResults=[];
    return;
  }
  const LIMIT=40;
  const shown=results.slice(0,LIMIT);
  let html="";
  shown.forEach((r,i)=>{
    html+=`<div class="search-result-row" onclick="goToSearchResult(${i})">
      <div class="search-result-main">
        <div class="search-result-jp">${escHtml(r.jp)}</div>
        <div class="search-result-en">${r.rom?escHtml(r.rom)+" &middot; ":""}${escHtml(r.en)}</div>
      </div>
      <span class="search-result-tag">${r.unitTab}</span>
    </div>`;
  });
  if(results.length>LIMIT){
    html+=`<div class="search-more">Showing ${LIMIT} of ${results.length} matches - keep typing to narrow it down</div>`;
  }
  wrap.innerHTML=html;
  wrap.classList.add("show");
  currentSearchResults=shown;
}

function goToSearchResult(i){
  const r=currentSearchResults[i];
  if(!r)return;
  switchTab(r.unitId);
  hideSearchResults();
  const input=document.getElementById("searchInput");
  if(input)input.blur();
  setTimeout(()=>{
    const key=r.unitId+"::"+r.jp;
    const el=document.querySelector('#unit-'+r.unitId+' [data-skey="'+CSS.escape(key)+'"]');
    if(el){
      if(typeof el.scrollIntoView==="function")el.scrollIntoView({behavior:"smooth",block:"center"});
      el.classList.add("search-highlight-flash");
      setTimeout(()=>el.classList.remove("search-highlight-flash"),1600);
    }
  },60);
}

function hideSearchResults(){
  const wrap=document.getElementById("searchResults");
  if(wrap)wrap.classList.remove("show");
}

function clearSearch(){
  const input=document.getElementById("searchInput");
  input.value="";
  document.getElementById("searchClearBtn").style.display="none";
  hideSearchResults();
  input.focus();
}

document.addEventListener("click",function(e){
  const wrap=document.getElementById("searchBarWrap");
  if(wrap && !wrap.contains(e.target))hideSearchResults();
});

function kanaToRomaji(str){
  // convert katakana to hiragana first
  let s="";
  for(const ch of str){
    const code=ch.charCodeAt(0);
    s+=(code>=0x30A1&&code<=0x30F6)?String.fromCharCode(code-0x60):ch;
  }
  let out="",doubleNext=false;
  const chars=[...s];
  for(let i=0;i<chars.length;i++){
    const ch=chars[i],next=chars[i+1];
    if(ch==="っ"){doubleNext=true;continue;}
    if(ch==="ー"){const m=out.match(/[aeiou](?=[^aeiou]*$)/);out+=m?m[0]:"";continue;}
    let r=KANA_BASE[ch];
    if(r===undefined){out+=ch;doubleNext=false;continue;}
    if(next && SMALL_Y[next] && r.endsWith("i") && r.length>1){
      if(r==="shi")r="sh"+SMALL_Y[next];
      else if(r==="chi")r="ch"+SMALL_Y[next];
      else if(r==="ji")r="j"+SMALL_Y[next];
      else r=r.slice(0,-1)+"y"+SMALL_Y[next];
      i++;
    }
    if(doubleNext){out+=(r.startsWith("ch")?"t":r[0]);doubleNext=false;}
    out+=r;
  }
  return out.replace(/\s+/g," ").trim();
}

async function fetchWithTimeout(url,ms){
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  const t=setTimeout(()=>{if(ctrl)ctrl.abort();},ms);
  try{return await fetch(url,ctrl?{signal:ctrl.signal}:{});}
  finally{clearTimeout(t);}
}
async function translateViaGoogle(text,sl,tl){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&dt=rm&q="+encodeURIComponent(text);
  const res=await fetchWithTimeout(url,8000);
  if(!res.ok)throw new Error("google "+res.status);
  const data=await res.json();
  const segs=(data&&data[0])||[];
  let translated="",targetRom="",sourceRom="";
  segs.forEach(s=>{
    if(!Array.isArray(s))return;
    if(s[0])translated+=s[0];
    else{if(s[2])targetRom=s[2];if(s[3])sourceRom=s[3];}
  });
  if(!translated)throw new Error("empty");
  return {translated,targetRom,sourceRom};
}
async function translateViaMyMemory(text,sl,tl){
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+sl+"|"+tl;
  const res=await fetchWithTimeout(url,8000);
  if(!res.ok)throw new Error("mymemory "+res.status);
  const data=await res.json();
  const t=data&&data.responseData&&data.responseData.translatedText;
  if(!t)throw new Error("empty");
  return {translated:t,targetRom:"",sourceRom:""};
}

let currentTranslation=null;
let translateRequestId=0;

function renderTranslateTab(){
  const div=document.getElementById("unit-translate");
  if(!div)return;
  div.innerHTML=`<div class="unit-title">Translate</div>
    <div class="unit-sub">Type English or Japanese - it detects which automatically. Save anything useful to your Saved Phrases.</div>
    <div class="tr-card">
      <textarea id="trInput" class="tr-input" rows="3" maxlength="500" placeholder="e.g. Where is the nearest convenience store?" oninput="updateTrDirection()" onkeydown="trKeydown(event)"></textarea>
      <div class="tr-row">
        <span class="tr-dir" id="trDir">English &rarr; Japanese</span>
        <button id="trBtn" class="tr-btn" onclick="runTranslate()">Translate</button>
      </div>
    </div>
    <div id="trResult"></div>
    <div class="tr-disclaimer">Needs an internet connection. Machine translation isn't perfect - for anything important (allergies, medical, directions to your hotel), double-check with a person or show them the screen.</div>`;
}
function updateTrDirection(){
  const v=document.getElementById("trInput").value;
  document.getElementById("trDir").innerHTML=hasJapanese(v)?"Japanese &rarr; English":"English &rarr; Japanese";
}
function trKeydown(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();runTranslate();}
}
async function runTranslate(){
  const input=document.getElementById("trInput");
  const out=document.getElementById("trResult");
  const btn=document.getElementById("trBtn");
  const text=input.value.trim();
  if(!text){out.innerHTML="";return;}
  if(typeof navigator!=="undefined"&&navigator.onLine===false){
    out.innerHTML='<div class="tr-error">You appear to be offline. Translation needs internet - your Saved Phrases still work offline.</div>';
    return;
  }
  const jpToEn=hasJapanese(text);
  const sl=jpToEn?"ja":"en",tl=jpToEn?"en":"ja";
  const myId=++translateRequestId;
  out.innerHTML='<div class="tr-loading">Translating...</div>';
  btn.disabled=true;
  let r=null;
  try{r=await translateViaGoogle(text,sl,tl);}
  catch(e){try{r=await translateViaMyMemory(text,sl,tl);}catch(e2){r=null;}}
  if(myId!==translateRequestId)return; // a newer request replaced this one
  btn.disabled=false;
  if(!r){
    out.innerHTML='<div class="tr-error">Couldn\'t reach the translation service. Check your connection and try again.</div>';
    return;
  }
  let jp,en,rom;
  if(jpToEn){jp=text;en=r.translated;rom=r.sourceRom;}
  else{jp=r.translated;en=text;rom=r.targetRom;}
  if(!rom&&!hasKanji(jp))rom=kanaToRomaji(jp);
  currentTranslation={jp,en,rom,dir:jpToEn?"ja-en":"en-ja"};
  renderTranslationResult();
}
function renderTranslationResult(savedMsg){
  const out=document.getElementById("trResult");
  if(!out||!currentTranslation)return;
  const t=currentTranslation;
  const already=loadSaved().some(s=>s.jp===t.jp);
  out.innerHTML=`<div class="tr-result-card">
    <div class="tr-result-label">Japanese</div>
    <div class="tr-result-jp">${escHtml(t.jp)}</div>
    ${t.rom?`<div class="tr-result-rom">${escHtml(t.rom)}</div>`:""}
    <div class="tr-result-label">English</div>
    <div class="tr-result-en">${escHtml(t.en)}</div>
    <div class="tr-result-actions">
      <button class="tr-listen" onclick="playCurrentTranslation()">&#9654; Listen</button>
      <button class="tr-listen slow" onclick="playCurrentTranslation(0.6)">&#9654; Slow</button>
    </div>
    ${already
      ?`<div class="tr-saved-state">&#10003; ${savedMsg||"In your Saved Phrases"} <button class="tr-link" onclick="switchTab('saved')">View</button></div>`
      :`<input id="trNote" class="tr-note" type="text" maxlength="120" placeholder="Optional note (e.g. where you'd use it)">
        <button class="tr-save" onclick="saveCurrentTranslation()">&#9733; Save to Saved Phrases</button>`}
  </div>`;
}
function playCurrentTranslation(rate){
  if(!currentTranslation)return;
  const prev=currentSpeed;
  if(rate)currentSpeed=rate;
  speakPhrase(currentTranslation.jp,currentTranslation.en,null);
  currentSpeed=prev;
}
function saveCurrentTranslation(){
  if(!currentTranslation)return;
  const noteEl=document.getElementById("trNote");
  const t=currentTranslation;
  const result=addSavedPhrase({jp:t.jp,en:t.en,rom:t.rom,note:noteEl?noteEl.value.trim():""});
  if(result==="fail"){alert("Couldn't save - your browser storage may be full or disabled.");return;}
  renderTranslationResult(result==="dup"?"Already in your Saved Phrases":"Saved!");
  renderSavedTab();
  buildSearchIndex();
}

// Saved phrases storage
function loadSaved(){
  try{const raw=localStorage.getItem("jpGuideSaved");const a=raw?JSON.parse(raw):[];return Array.isArray(a)?a:[];}
  catch(e){return [];}
}
function saveSavedList(list){
  try{localStorage.setItem("jpGuideSaved",JSON.stringify(list));return true;}catch(e){return false;}
}
function addSavedPhrase(item){
  const list=loadSaved();
  if(list.some(s=>s.jp===item.jp))return "dup";
  list.unshift({
    id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    jp:item.jp,en:item.en,rom:item.rom||"",note:item.note||"",created:Date.now()
  });
  return saveSavedList(list)?"ok":"fail";
}
function deleteSavedPhrase(id){
  if(!confirm("Remove this phrase from Saved Phrases?"))return;
  saveSavedList(loadSaved().filter(s=>s.id!==id));
  renderSavedTab();
  buildSearchIndex();
  if(currentTranslation)renderTranslationResult();
}
function playSaved(id,btn){
  const it=loadSaved().find(s=>s.id===id);
  if(it)speakPhrase(it.jp,it.en,btn);
}
function addManualSaved(){
  const jp=document.getElementById("svJp").value.trim();
  const en=document.getElementById("svEn").value.trim();
  let rom=document.getElementById("svRom").value.trim();
  const note=document.getElementById("svNote").value.trim();
  if(!jp||!en){alert("Add at least the Japanese and the English.");return;}
  if(!rom&&!hasKanji(jp))rom=kanaToRomaji(jp);
  const result=addSavedPhrase({jp,en,rom,note});
  if(result==="dup"){alert("That phrase is already saved.");return;}
  if(result==="fail"){alert("Couldn't save - your browser storage may be full or disabled.");return;}
  renderSavedTab();
  buildSearchIndex();
}
function startSavedReview(){
  const items=shuffleArr(loadSaved()).map(s=>({jp:escHtml(s.jp),en:escHtml(s.en),rom:escHtml(s.rom||"")}));
  starReviewSessions["saved"]={items,index:0,known:0,review:0,flipped:false};
  renderStarReviewSession("saved");
}
function renderSavedTab(){
  const div=document.getElementById("unit-saved");
  if(!div)return;
  const list=loadSaved();
  let html=`<div class="unit-title">Saved Phrases</div>
    <div class="unit-sub">Phrases you saved from Translate or added yourself. Stored on this device and available offline.</div>
    <details class="saved-add">
      <summary>+ Add a phrase manually</summary>
      <div class="saved-add-body">
        <input id="svJp" class="tr-note" type="text" placeholder="Japanese (required)">
        <input id="svRom" class="tr-note" type="text" placeholder="Romaji (optional - auto-filled for kana)">
        <input id="svEn" class="tr-note" type="text" placeholder="English (required)">
        <input id="svNote" class="tr-note" type="text" placeholder="Note (optional)">
        <button class="tr-save" onclick="addManualSaved()">Add Phrase</button>
      </div>
    </details>`;
  if(!list.length){
    html+=`<div class="saved-empty">
      <div class="saved-empty-icon">&#9734;</div>
      <div>No saved phrases yet.</div>
      <div class="saved-empty-sub">Translate a sentence and tap "Save to Saved Phrases" - it will show up here.</div>
      <button class="tr-btn" onclick="switchTab('translate')">Go to Translate</button>
    </div>`;
  } else {
    html+=`<div class="section-divider blue">Your phrases (${list.length})</div>
      <button class="star-review-btn" onclick="startSavedReview()">Review as Flashcards</button>
      <div id="star-review-session-saved"></div>
      <div class="vocab-table" style="margin-top:12px;">`;
    list.forEach(it=>{
      html+=`<div class="vocab-row" data-skey="${escHtml("saved::"+it.jp)}" onclick="playSaved('${it.id}',this.querySelector('.vocab-play'))">
        <div class="vocab-main">
          <div class="vocab-jp">${escHtml(it.jp)}</div>
          <div class="vocab-sub"><span class="vocab-rom">${escHtml(it.rom||"")}</span><span class="vocab-en">${escHtml(it.en)}</span></div>
          ${it.note?`<div class="vocab-note">* ${escHtml(it.note)}</div>`:""}
        </div>
        <div class="vocab-actions">
          <button class="saved-del" onclick="event.stopPropagation();deleteSavedPhrase('${it.id}')">&times;</button>
          <button class="vocab-play" onclick="event.stopPropagation();playSaved('${it.id}',this)">&gt;&gt;</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  div.innerHTML=html;
}

renderTranslateTab();
renderSavedTab();
buildSearchIndex();
</script>
